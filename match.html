<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe ETFs • TopDividendETFs.com</title>
<meta name="description" content="Dating-style swiping for Dividend ETFs. Swipe Yes or No and discover your next high-yield investment.">

<!-- Social Media Card / Open Graph -->
<meta property="og:title" content="Online Dating but for Dividend ETFs • TopDividendETFs.com">
<meta property="og:description" content="Swipe for Dividend ETFs. Swipe Yes or No on the best high-yield income ETFs.">

<meta property="og:url" content="https://topdividendetfs.com/dating">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Swipe Dividend ETFs • TopDividendETFs.com">
<meta name="twitter:description" content="Tinder for Dividend ETFs. Swipe Yes or No on the best high-yield income ETFs.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;family=DM+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root {
  --teal-900:#0D3D38; --teal-700:#0F766E; --teal-500:#14B8A6;
  --green-500:#10B981; --red-500:#EF4444;
  --slate-900:#0F172A; --slate-800:#1E293B; --slate-700:#334155;
  --slate-500:#64748B; --slate-50:#F8FAFC; --white:#FFFFFF;
  --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--slate-50); color:var(--slate-800); line-height:1.6; overflow-x:hidden; }

.site-header { position:sticky; top:0; z-index:200; background:rgba(13,61,56,.96); backdrop-filter:blur(24px); border-bottom:1px solid rgba(255,255,255,.12); }
.header-inner { max-width:1280px; margin:0 auto; padding:0 20px; height:64px; display:flex; align-items:center; justify-content:space-between; }
.header-logo { font-size:18px; font-weight:700; color:white; letter-spacing:-0.4px; }

.top-bar { background:linear-gradient(160deg,var(--teal-900) 0%,var(--slate-900) 100%); padding:16px 20px; text-align:center; color:white; }
.top-bar p { font-size:15.5px; opacity:0.9; }

.try-pro-btn {
  display:block; margin:12px auto 0; padding:10px 24px; background:#10B981; color:white;
  border:none; border-radius:999px; font-weight:700; font-size:15px; cursor:pointer;
  box-shadow:0 4px 12px rgba(16,185,129,0.3);
}
.try-pro-btn:hover { background:#0F766E; transform:translateY(-1px); }

.swipe-container { max-width:520px; margin:16px auto 4px; position:relative; min-height:510px; }
.etf-card { position:absolute; inset:0; background:white; border-radius:28px; overflow:hidden; box-shadow:0 25px 70px -10px rgba(15,23,42,.22); display:flex; flex-direction:column; transition:all .45s cubic-bezier(0.34,1.56,0.64,1); }
.etf-card.swipe-left { transform:translateX(-440px) rotate(-26deg) !important; opacity:0; }
.etf-card.swipe-right { transform:translateX(440px) rotate(26deg) !important; opacity:0; }

.card-header { height:172px; background:linear-gradient(135deg,#0F766E,#14B8A6); color:white; padding:0 28px 20px; display:flex; align-items:flex-end; }
.ticker-big { font-size: clamp(46px, 10vw, 66px); font-weight:700; font-family:var(--mono); letter-spacing:-4px; line-height:1; }
.etf-name { font-size:18.5px; font-weight:600; margin-top:4px; opacity:0.95; }

.main-focus { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px; background:white; }
.focus-box { background:#F0FDFA; border-radius:16px; padding:14px 10px; text-align:center; border:2px solid #14B8A6; }
.focus-box.yield { border-color:#10B981; }
.focus-val { font-size:27px; font-weight:700; font-family:var(--mono); line-height:1; }
.focus-label { font-size:11px; font-weight:700; color:#0F766E; text-transform:uppercase; letter-spacing:0.7px; margin-top:4px; }

.stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:12px 20px; background:white; border-bottom:1px solid #E2E8F0; }
.stat-box { text-align:center; }
.stat-val { font-size:16px; font-weight:700; font-family:var(--mono); color:var(--teal-700); }
.stat-lbl { font-size:9px; font-weight:600; color:var(--slate-500); text-transform:uppercase; letter-spacing:0.5px; }

.expanded-info { flex:1; overflow:auto; padding:16px 20px 8px; background:var(--slate-50); font-size:14.2px; }
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.info-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #E2E8F0; }
.info-label { color:var(--slate-600); font-size:13.5px; }
.info-value { font-weight:600; font-family:var(--mono); }

.actions { display:flex; justify-content:center; gap:36px; padding:8px 20px 24px; }
.action-btn { width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:34px; box-shadow:0 10px 30px rgba(0,0,0,.15); transition:all .2s; border:5px solid white; }
#noBtn { background:white; color:var(--red-500); }
#yesBtn { background:var(--green-500); color:white; }

.progress-bar { height:6px; background:var(--teal-100); margin:0 40px 8px; border-radius:999px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--teal-500),var(--cyan-500)); width:0%; transition:width .5s ease; }

/* Offer Modal */
#offerModal { position:fixed; inset:0; background:rgba(15,23,42,.85); display:none; align-items:center; justify-content:center; z-index:700; }
#offerContent { background:white; max-width:420px; width:92%; border-radius:24px; padding:32px 28px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3); }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="header-logo">TopDividendETFs.com <span></span></a>
    <button onclick="showSaved()" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:8px 18px;border-radius:999px;font-weight:600">❤️ Saved (<span id="savedCount">0</span>)</button>
  </div>
</header>

<div class="top-bar">
  <p>Swipe to discover your next high yield ETF!</p>
</div>

<!-- New Button -->
<div style="text-align:center; margin:8px 0 12px;">
  <button onclick="window.open('https://TopDividendETFsPRO.com','_blank')" style="padding:10px 28px; background:#10B981; color:white; border:none; border-radius:999px; font-weight:700; font-size:15.5px; cursor:pointer; box-shadow:0 4px 12px rgba(16,185,129,0.3);">
    Try TopDividendETFsPRO.com →
  </button>
</div>

<div style="max-width:1280px;margin:0 auto;padding:0 20px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;font-size:14px">
    <div>Remaining: <strong id="remaining">42</strong></div>
    <div>
      <button onclick="newCard()" style="padding:6px 16px;background:white;border:2px solid var(--teal-400);color:var(--teal-700);border-radius:999px;font-weight:600;margin-right:8px">New Card</button>
      <button onclick="shuffleDeck()" style="padding:6px 16px;background:white;border:2px solid var(--teal-400);color:var(--teal-700);border-radius:999px;font-weight:600">🔀 Shuffle</button>
    </div>
  </div>

  <div class="swipe-container" id="swipeContainer"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="actions">
    <button id="noBtn" class="action-btn" onclick="swipeLeft()">✕</button>
    <button id="yesBtn" class="action-btn" onclick="swipeRight()">❤️</button>
  </div>
</div>

<!-- Offer Modal -->
<div id="offerModal">
  <div id="offerContent">
    <h2 id="offerTitle" style="font-size:22px;margin-bottom:16px"></h2>
    <p id="offerText" style="margin-bottom:28px;line-height:1.5;color:#334155"></p>
    <div style="display:flex;gap:12px">
      <button onclick="goToMainSite()" style="flex:1;padding:16px;background:#10B981;color:white;border:none;border-radius:16px;font-weight:700;font-size:17px">Take Me There →</button>
      <button onclick="closeOfferModal()" style="flex:1;padding:16px;background:#E2E8F0;color:#334155;border:none;border-radius:16px;font-weight:700">No Thanks</button>
    </div>
  </div>
</div>

<!-- Saved Panel -->
<div id="savedPanel" style="position:fixed;bottom:20px;right:20px;background:white;border-radius:20px;box-shadow:0 20px 60px -10px rgba(0,0,0,.25);width:340px;max-height:560px;overflow:hidden;z-index:500;display:none">
  <div style="padding:16px 22px;background:var(--teal-700);color:white;display:flex;justify-content:space-between;align-items:center">
    <span>❤️ My Watchlist</span>
    <span onclick="hideSaved()" style="cursor:pointer;font-size:24px">✕</span>
  </div>
  <div id="savedList" style="max-height:440px;overflow:auto"></div>
</div>

<!-- Detail Modal -->
<div id="detailModal" style="position:fixed;inset:0;background:rgba(15,23,42,.8);display:none;align-items:center;justify-content:center;z-index:600">
  <div style="background:white;width:94%;max-width:520px;border-radius:24px;max-height:92vh;overflow:auto">
    <div style="padding:24px 28px;background:var(--teal-700);color:white;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0">
      <div id="modalTickerBig" style="font-size:32px;font-family:var(--mono);font-weight:700"></div>
      <span onclick="closeModal()" style="font-size:32px;cursor:pointer">✕</span>
    </div>
    <div id="modalBody" style="padding:28px"></div>
  </div>
</div>

<footer style="text-align:center;padding:50px 20px;color:#64748B;font-size:13px">
  TopDividendETFs.com • Data updated daily • Not financial advice • NOT A BUY OR SELL SIGNAL!
</footer>

<script>
// ==================== DATA ====================
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxCiod-Cwry7E6k9Un9dgrM_ANymC36_IO_wLyNj-YDo2KI7mp_1ZzyNBnBGZOxT48QPM8TCwtsmA4/pub?gid=0&single=true&output=csv";

let allETFs = [];
let deck = [];
let currentIndex = 0;
let savedETFs = [];
let totalSwipes = 0;

function cleanPct(val) {
  if (!val) return '—';
  return val.toString().replace('%','').trim();
}

async function loadETFs() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    const text = await res.text();
    const lines = text.trim().split('\n');
    allETFs = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
      if (cols.length < 12 || !cols[0]) continue;

      allETFs.push({
        symbol: cols[0].toUpperCase(),
        name: cols[1],
        provider: cols[2],
        yield: cleanPct(cols[3]),
        taxGrade: cols[4],
        expRatio: cleanPct(cols[5]),
        aum: cols[6],
        totalReturn: cols[7] || '—',
        priceDecay: cols[8],
        inception: cols[9],
        frequency: cols[10],
        rating: cols[11]
      });
    }
    resetDeck();
  } catch(e) { console.error(e); }
}

function resetDeck() {
  deck = [...allETFs].sort(() => Math.random() - 0.5);
  currentIndex = 0;
  renderCurrentCard();
}

function shuffleDeck() {
  deck = [...allETFs].sort(() => Math.random() - 0.5);
  currentIndex = 0;
  renderCurrentCard();
}

// ==================== RENDER CARD ====================
function renderCurrentCard() {
  const container = document.getElementById('swipeContainer');
  container.innerHTML = '';

  if (currentIndex >= deck.length) {
    container.innerHTML = `
      <div style="height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;border-radius:28px;box-shadow:0 25px 70px -10px rgba(0,0,0,.15);text-align:center;padding:40px">
        <h2 style="font-size:32px">🎉 All done!</h2>
        <p style="margin:16px 0 30px;color:#64748B">Refresh for a brand new deck</p>
        <button onclick="location.reload()" style="padding:14px 40px;background:#0F766E;color:white;border:none;border-radius:999px;font-size:17px">🔄 New Deck</button>
      </div>`;
    return;
  }

  const etf = deck[currentIndex];

  const html = `
    <div class="etf-card" id="mainCard" ondblclick="showDetail('${etf.symbol}')">
      <div class="card-header">
        <div>
          <div class="ticker-big">${etf.symbol}</div>
          <div class="etf-name">${etf.name}</div>
        </div>
      </div>

      <div class="main-focus">
        <div class="focus-box yield">
          <div class="focus-val">${etf.yield}%</div>
          <div class="focus-label">Dividend Yield</div>
        </div>
        <div class="focus-box">
          <div class="focus-val">${etf.totalReturn}</div>
          <div class="focus-label">Total Return</div>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-box"><div class="stat-val">${etf.taxGrade}</div><div class="stat-lbl">Tax</div></div>
        <div class="stat-box"><div class="stat-val">${etf.expRatio}%</div><div class="stat-lbl">Expense</div></div>
        <div class="stat-box"><div class="stat-val">${etf.frequency}</div><div class="stat-lbl">Freq</div></div>
        <div class="stat-box"><div class="stat-val">${etf.rating}</div><div class="stat-lbl">Rating</div></div>
      </div>

      <div class="expanded-info">
        <div class="info-grid">
          <div class="info-row"><span class="info-label">Provider</span><span class="info-value">${etf.provider}</span></div>
          <div class="info-row"><span class="info-label">AUM</span><span class="info-value">${etf.aum}</span></div>
          <div class="info-row"><span class="info-label">Inception</span><span class="info-value">${etf.inception}</span></div>
          <div class="info-row"><span class="info-label">Price Decay</span><span class="info-value">${etf.priceDecay}</span></div>
        </div>
      </div>
    </div>
  `;

  container.innerHTML = html;
  document.getElementById('remaining').textContent = deck.length - currentIndex;
  updateProgress();
}

function updateProgress() {
  const pct = deck.length ? Math.round((currentIndex / deck.length) * 100) : 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ==================== OFFER LOGIC ====================
function showOffer() {
  const offers = [
    { title: "Want Even More High-Income ETFs?", text: "Discover 100+ top dividend ETFs with strong yields and NO price decay on our main rankings page." },
    { title: "Looking for Better Dividend Options?", text: "Check out our full list of 100+ premium dividend ETFs — many with zero price decay and high monthly payouts." }
  ];

  const offer = offers[totalSwipes % 2];
  document.getElementById('offerTitle').textContent = offer.title;
  document.getElementById('offerText').textContent = offer.text;
  document.getElementById('offerModal').style.display = 'flex';
}

function closeOfferModal() {
  document.getElementById('offerModal').style.display = 'none';
}

function goToMainSite() {
  window.open('https://TopDividendETFs.com', '_blank');
  closeOfferModal();
}

// ==================== TRACKING (Silent) ====================
function trackPageView() {
  const symbol = deck[currentIndex] ? deck[currentIndex].symbol : 'Done';
  const ts = Date.now();
  const newUrl = window.location.origin + window.location.pathname + '?etf=' + symbol + '&t=' + ts;

  history.pushState({symbol}, '', newUrl);

  console.log(`[GA Track] Swipe → ${symbol}`);

  if (typeof dataLayer !== 'undefined') {
    dataLayer.push({
      event: 'page_view',
      page_location: newUrl,
      page_title: 'Swipe ETFs • ' + symbol
    });
  }

  if (typeof gtag !== 'undefined') {
    gtag('event', 'page_view', {
      page_location: newUrl,
      page_title: 'Swipe ETFs • ' + symbol
    });
  }
}

// ==================== SWIPES ====================
function swipeLeft() {
  const card = document.getElementById('mainCard');
  if (!card) return;
  card.classList.add('swipe-left');
  setTimeout(() => {
    currentIndex++;
    totalSwipes++;
    renderCurrentCard();
    trackPageView();
    checkForOffer();
  }, 420);
}

function swipeRight() {
  const card = document.getElementById('mainCard');
  if (!card) return;

  const etf = deck[currentIndex];
  if (etf && !savedETFs.some(e => e.symbol === etf.symbol)) {
    savedETFs.push(etf);
    document.getElementById('savedCount').textContent = savedETFs.length;
  }

  card.classList.add('swipe-right');
  setTimeout(() => {
    currentIndex++;
    totalSwipes++;
    renderCurrentCard();
    trackPageView();
    checkForOffer();
  }, 420);
}

function checkForOffer() {
  if (totalSwipes % 5 === 0 && totalSwipes > 0) {
    setTimeout(showOffer, 800);
  }
}

function newCard() { location.reload(); }

// Saved Panel
function showSaved() {
  const panel = document.getElementById('savedPanel');
  const list = document.getElementById('savedList');
  list.innerHTML = '';

  if (savedETFs.length === 0) {
    list.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#64748B">No saved ETFs yet.<br>Swipe right ❤️ on the ones you like!</div>`;
  } else {
    savedETFs.forEach((etf, idx) => {
      const div = document.createElement('div');
      div.style.padding = '14px 20px';
      div.style.borderBottom = '1px solid #E2E8F0';
      div.style.cursor = 'pointer';
      div.innerHTML = `<strong>${etf.symbol}</strong> — ${etf.yield}% <div style="font-size:13px;color:#64748B">${etf.name}</div>`;
      div.onclick = () => showDetail(etf.symbol);
      const rm = document.createElement('span');
      rm.style.cssText = 'float:right;color:#ef4444;font-size:20px;cursor:pointer;';
      rm.textContent = '✕';
      rm.onclick = (e) => { e.stopImmediatePropagation(); removeSaved(idx); };
      div.appendChild(rm);
      list.appendChild(div);
    });
  }
  panel.style.display = 'block';
}

function hideSaved() { document.getElementById('savedPanel').style.display = 'none'; }
function removeSaved(idx) {
  savedETFs.splice(idx, 1);
  document.getElementById('savedCount').textContent = savedETFs.length;
  showSaved();
}

function showDetail(symbol) {
  const etf = allETFs.find(e => e.symbol === symbol);
  if (!etf) return;

  document.getElementById('modalTickerBig').innerHTML = `${etf.symbol} <span style="font-size:18px">(${etf.yield}%)</span>`;

  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h2 style="margin-bottom:20px;font-size:23px">${etf.name}</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px">
      <div style="background:#F0FDFA;padding:20px;border-radius:16px;text-align:center">
        <div style="font-size:42px;font-weight:700;color:#10B981">${etf.yield}%</div>
        <div style="font-size:13px;color:#0F766E">YIELD</div>
      </div>
      <div style="background:#F0FDFA;padding:20px;border-radius:16px;text-align:center">
        <div style="font-size:42px;font-weight:700;color:#0F766E">${etf.totalReturn}</div>
        <div style="font-size:13px;color:#0F766E">TOTAL RETURN</div>
      </div>
    </div>
    <div style="background:white;border:1px solid #E2E8F0;border-radius:16px;padding:22px">
      <div class="info-row"><span class="info-label">Provider</span><span class="info-value">${etf.provider}</span></div>
      <div class="info-row"><span class="info-label">Expense Ratio</span><span class="info-value">${etf.expRatio}%</span></div>
      <div class="info-row"><span class="info-label">AUM</span><span class="info-value">${etf.aum}</span></div>
      <div class="info-row"><span class="info-label">Frequency</span><span class="info-value">${etf.frequency}</span></div>
      <div class="info-row"><span class="info-label">Inception</span><span class="info-value">${etf.inception}</span></div>
      <div class="info-row"><span class="info-label">Tax Grade</span><span class="info-value">${etf.taxGrade}</span></div>
      <div class="info-row"><span class="info-label">Price Decay</span><span class="info-value">${etf.priceDecay}</span></div>
      <div class="info-row"><span class="info-label">Rating</span><span class="info-value">${etf.rating}</span></div>
    </div>
    <div style="margin-top:32px;display:flex;gap:12px">
      <button onclick="saveFromModal('${etf.symbol}');closeModal()" style="flex:1;padding:18px;background:#10B981;color:white;border:none;border-radius:16px;font-weight:700">❤️ Save to Watchlist</button>
      <button onclick="closeModal()" style="flex:1;padding:18px;background:#E2E8F0;color:#334155;border:none;border-radius:16px;font-weight:700">Close</button>
    </div>
  `;
  document.getElementById('detailModal').style.display = 'flex';
}

function saveFromModal(symbol) {
  const etf = allETFs.find(e => e.symbol === symbol);
  if (etf && !savedETFs.some(e => e.symbol === symbol)) {
    savedETFs.push(etf);
    document.getElementById('savedCount').textContent = savedETFs.length;
  }
}

function closeModal() {
  document.getElementById('detailModal').style.display = 'none';
}

// Keyboard + Touch
document.addEventListener('keydown', e => {
  if (e.key === "ArrowLeft") swipeLeft();
  if (e.key === "ArrowRight") swipeRight();
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (diff < -80) swipeLeft();
  if (diff > 80) swipeRight();
});

window.onload = loadETFs;
</script>
</body>
</html>
