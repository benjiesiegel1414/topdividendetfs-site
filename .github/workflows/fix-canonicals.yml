name: One-time - fix canonical tags

# Points every top-level page's canonical tag at its own clean URL, then deletes this workflow.
on:
  push:
    paths: [".github/workflows/fix-canonicals.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonicals
        run: |
          cat > /tmp/fix_canonicals.py <<'PY'
          #!/usr/bin/env python3
          """One-time: give every top-level page a canonical tag pointing at its own clean URL
          (https://topdividendetfs.com/<name>, no .html), which is how GitHub Pages serves it and what the
          sitemap lists. Several pages pointed at .html versions or at URLs that don't exist."""
          import os, re, sys
          SITE = 'https://topdividendetfs.com'
          SKIP = {'x-queue.html', '404.html', 'google-verification.html'}
          NOINDEX = {'new-display-ovl.html'}  # ad test copy of the homepage
          changed = []
          for f in sorted(os.listdir('.')):
              if not f.endswith('.html') or f in SKIP: continue
              s = open(f, encoding='utf-8').read(); o = s
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]*noindex', s, re.I) and f not in NOINDEX:
                  continue
              if f in NOINDEX:
                  if not re.search(r'<meta[^>]+name=["\']robots', s, re.I):
                      s = re.sub(r'(<head[^>]*>)', r'\1\n  <meta name="robots" content="noindex, follow">', s, count=1, flags=re.I)
              elif f == 'etf.html':
                  # already redirects ?symbol=X to /etfs/x; keep the old URLs out of Google's index
                  s = re.sub(r'(<meta name="robots" content=")index, follow(")', r'\1noindex, follow\2', s, count=1)
                  if not re.search(r'<meta[^>]+name=["\']robots', s, re.I):
                      s = re.sub(r'(<head[^>]*>)', r'''\1
            <meta name="robots" content="noindex, follow">
            <script>(function(){var s=(new URLSearchParams(location.search).get('symbol')||'').toLowerCase().replace(/[^a-z0-9.]/g,'');if(!s)return;fetch('/etfs/'+s,{method:'HEAD'}).then(function(r){if(r.ok)location.replace('/etfs/'+s);}).catch(function(){});})();</script>''', s, count=1, flags=re.I)
              else:
                  url = SITE + '/' + ('' if f == 'index.html' else f[:-5])
                  tag = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]*>', s, re.I)
                  if tag:
                      new = re.sub(r'href=["\'][^"\']*["\']', f'href="{url}"', tag.group(0), count=1)
                      s = s.replace(tag.group(0), new, 1)
                  else:
                      s = re.sub(r'(\s*)</head>', f'\n  <link rel="canonical" href="{url}">\\1</head>', s, count=1, flags=re.I)
              if s != o:
                  open(f, 'w', encoding='utf-8').write(s); changed.append(f)
          print(len(changed), 'pages updated:', ' '.join(changed))

          PY
          python3 /tmp/fix_canonicals.py
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/fix-canonicals.yml
          git add -A
          git commit -m "Fix canonical tags: every page points at its own clean URL"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
