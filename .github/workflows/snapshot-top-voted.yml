name: Snapshot Top Voted ETFs

on:
  schedule:
    # Every 6 hours. Vote totals move slowly enough that this is plenty,
    # and the live fetch on the page keeps visitors current in between.
    - cron: '0 */6 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: snapshot-top-voted
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bake top 10 into the page
        run: node snapshot-top-voted.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git add top-voted-etfs.html data/top-voted.json
          git commit -m "Snapshot top voted ETFs [skip ci]"
          git push
