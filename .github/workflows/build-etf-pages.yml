name: Build ETF pages

# Builds /etfs/<symbol>.html for every ETF in the TopDividendETFs Google Sheet,
# plus the hub pages (A to Z, highest yield, largest, grades, issuers, strategies).
# Add a row to the sheet and its page appears on the next run.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/build-etf-pages.mjs'
      - 'scripts/build-etf-images.mjs'
      - '.github/workflows/build-etf-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-etf-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build ETF ticker images (only new or renamed ETFs are rendered)
        run: |
          npm i --no-save --no-package-lock --no-audit --no-fund satori@0.35.0 @resvg/resvg-js@2.6.2 @fontsource/lato@5.3.0
          node scripts/build-etf-images.mjs
          rm -rf node_modules

      - name: Build ETF pages from the Google Sheet
        run: |
          rm -rf etfs
          node scripts/build-etf-pages.mjs

      - name: Rebuild sitemap
        run: node generate-sitemap.js

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A etfs etf-images sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Build ETF pages [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow do not trigger deploy.yml, so deploy here.
      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
