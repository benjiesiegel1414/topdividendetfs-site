name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  pages: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Safety net: every .html page must carry the Google Analytics tag.
      # Any page that is missing it gets the tag added in the deployed copy.
      - name: Make sure every page has the GA tag
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          const ID="G-B8TGV115DP";
          const TAG="<script async src=\"https://www.googletagmanager.com/gtag/js?id="+ID+"\"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag(\"js\",new Date());gtag(\"config\",\""+ID+"\");</script>";
          let n=0;
          (function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.name.startsWith(".")||e.name==="node_modules")continue;const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(p.endsWith(".html")){let s=fs.readFileSync(p,"utf8");if(s.includes(ID))continue;const i=s.search(/<\/head>/i);if(i<0)continue;fs.writeFileSync(p,s.slice(0,i)+TAG+"\n"+s.slice(i));n++;console.log("GA tag added:",p);}}})(".");
          console.log("Pages fixed:",n);
          '

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      # GitHub Pages sometimes returns a one-off server error (HTTP 500).
      # Try the deploy up to 3 times, 2 minutes apart, before failing the run.
      - name: Deploy to GitHub Pages (try 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait 2 minutes before retrying
        if: steps.deploy1.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (try 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait 2 more minutes before the last try
        if: steps.deploy2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (try 3)
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
