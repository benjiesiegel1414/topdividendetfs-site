<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe ETFs • Top Dividend ETFs PRO</title>
<meta name="description" content="Tinder for Dividend ETFs. Swipe Yes or No and discover your next high-yield investment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;family=DM+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --teal-900:#0D3D38; --teal-700:#0F766E; --teal-500:#14B8A6;
  --green-500:#10B981; --red-500:#EF4444;
  --slate-900:#0F172A; --slate-800:#1E293B; --slate-700:#334155;
  --slate-500:#64748B; --slate-50:#F8FAFC; --white:#FFFFFF;
  --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:var(--font); background:var(--slate-50); color:var(--slate-800);
  line-height:1.6; overflow-x:hidden;
}

.site-header {
  position:sticky; top:0; z-index:200; background:rgba(13,61,56,.96);
  backdrop-filter:blur(24px); border-bottom:1px solid rgba(255,255,255,.12);
}
.header-inner {
  max-width:1280px; margin:0 auto; padding:0 20px; height:68px;
  display:flex; align-items:center; justify-content:space-between;
}
.header-logo { font-size:19px; font-weight:700; color:white; letter-spacing:-0.4px; }

.hero {
  background:linear-gradient(160deg,var(--teal-900) 0%,var(--slate-900) 55%,#1a1040 100%);
  padding:50px 20px 40px; text-align:center; position:relative;
}
.hero h1 {
  font-size: clamp(28px, 5.5vw, 42px); font-weight:700; color:white;
  letter-spacing:-1.8px; margin-bottom:8px;
}
.hero p { color:rgba(255,255,255,.8); font-size:16.5px; max-width:520px; margin:0 auto; }

.swipe-container {
  max-width:520px; margin:30px auto 20px; position:relative; min-height:640px;
}
.etf-card {
  position:absolute; inset:0; background:white; border-radius:24px; overflow:hidden;
  box-shadow:0 25px 70px -10px rgba(15,23,42,.18);
  display:flex; flex-direction:column; transition:all .45s cubic-bezier(0.34,1.56,0.64,1);
}
.etf-card.swipe-left { transform:translateX(-420px) rotate(-26deg) !important; opacity:0; }
.etf-card.swipe-right { transform:translateX(420px) rotate(26deg) !important; opacity:0; }

.card-header {
  height:190px; background:linear-gradient(135deg,#0F766E,#14B8A6);
  color:white; padding:0 28px 20px; display:flex; align-items:flex-end;
}
.ticker-big { font-size: clamp(52px, 11vw, 72px); font-weight:700; font-family:var(--mono); letter-spacing:-4px; }
.etf-name { font-size:19px; font-weight:600; margin-top:4px; opacity:0.95; }

.stats-bar {
  display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
  padding:18px 20px; background:white; border-bottom:1px solid #E2E8F0;
}
.stat-box { text-align:center; }
.stat-val { font-size:19px; font-weight:700; font-family:var(--mono); color:var(--teal-700); }
.stat-lbl { font-size:9.5px; font-weight:600; color:var(--slate-500); text-transform:uppercase; letter-spacing:0.5px; }

.expanded-info {
  flex:1; overflow:auto; padding:24px; background:var(--slate-50); font-size:14.8px;
}
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.info-row {
  display:flex; justify-content:space-between; padding:8px 0;
  border-bottom:1px solid #E2E8F0;
}
.info-label { color:var(--slate-600); }
.info-value { font-weight:600; font-family:var(--mono); }

.actions {
  display:flex; justify-content:center; gap:40px; padding:30px 20px;
}
.action-btn {
  width:76px; height:76px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:36px;
  box-shadow:0 10px 30px rgba(0,0,0,.15); transition:all .2s; border:5px solid white;
}
#noBtn { background:white; color:var(--red-500); }
#yesBtn { background:var(--green-500); color:white; }

.progress-bar {
  height:6px; background:var(--teal-100); margin:0 40px 10px; border-radius:999px; overflow:hidden;
}
.progress-fill {
  height:100%; background:linear-gradient(90deg,var(--teal-500),var(--cyan-500));
  width:0%; transition:width .5s ease;
}

@media (max-width: 640px) {
  .swipe-container { min-height:580px; }
  .card-header { height:170px; }
  .stats-bar { padding:14px 16px; }
  .stat-val { font-size:17px; }
  .expanded-info { padding:20px; font-size:14px; }
  .actions { gap:32px; padding:24px 20px; }
  .action-btn { width:68px; height:68px; font-size:32px; }
}

/* Saved & Modal */
.saved-panel, .modal { /* same as before */ }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="header-logo">Top Dividend ETFs <span>PRO</span></a>
    <button onclick="showSaved()" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:8px 18px;border-radius:999px;font-weight:600">
      ❤️ Saved (<span id="savedCount">0</span>)
    </button>
  </div>
</header>

<section class="hero">
  <h1>Swipe Dividend ETFs</h1>
  <p>Discover your next high-yield winner — Tinder style</p>
</section>

<div style="max-width:1280px;margin:0 auto;padding:0 20px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;font-size:14px">
    <div>Remaining: <strong id="remaining">42</strong></div>
    <div>
      <button onclick="newCard()" style="padding:7px 18px;background:white;border:2px solid var(--teal-400);color:var(--teal-700);border-radius:999px;font-weight:600;margin-right:8px">New Card</button>
      <button onclick="shuffleDeck()" style="padding:7px 18px;background:white;border:2px solid var(--teal-400);color:var(--teal-700);border-radius:999px;font-weight:600">🔀 Shuffle</button>
    </div>
  </div>

  <div class="swipe-container" id="swipeContainer"></div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="actions">
    <button id="noBtn" class="action-btn" onclick="swipeLeft()">✕</button>
    <button id="yesBtn" class="action-btn" onclick="swipeRight()">❤️</button>
  </div>
</div>

<!-- Saved Panel & Modal (same as previous version) -->
<div class="saved-panel" id="savedPanel" style="position:fixed;bottom:20px;right:20px;background:white;border-radius:20px;box-shadow:0 20px 60px -10px rgba(0,0,0,.25);width:340px;max-height:560px;overflow:hidden;z-index:500;display:none">
  <div class="saved-header" style="padding:18px 22px;background:var(--teal-700);color:white;display:flex;justify-content:space-between">
    <span>❤️ My Watchlist</span>
    <span onclick="hideSaved()" style="cursor:pointer;font-size:24px">✕</span>
  </div>
  <div class="saved-list" id="savedList" style="max-height:440px;overflow:auto"></div>
</div>

<div class="modal" id="detailModal" style="position:fixed;inset:0;background:rgba(15,23,42,.8);display:none;align-items:center;justify-content:center;z-index:600">
  <div class="modal-content" style="background:white;width:94%;max-width:520px;border-radius:24px;max-height:92vh;overflow:auto">
    <div class="modal-header" style="padding:24px 28px;background:var(--teal-700);color:white;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0">
      <div id="modalTickerBig" style="font-size:32px;font-family:var(--mono);font-weight:700"></div>
      <span onclick="closeModal()" style="font-size:32px;cursor:pointer">✕</span>
    </div>
    <div id="modalBody" style="padding:28px"></div>
  </div>
</div>

<footer style="text-align:center;padding:60px 20px;color:#64748B;font-size:13px">
  TopDividendETFs.com • Data updated daily • Not financial advice
</footer>

<script>
// ==================== DATA & STATE ====================
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxCiod-Cwry7E6k9Un9dgrM_ANymC36_IO_wLyNj-YDo2KI7mp_1ZzyNBnBGZOxT48QPM8TCwtsmA4/pub?gid=0&single=true&output=csv";

let allETFs = [];
let deck = [];
let currentIndex = 0;
let savedETFs = [];

// Clean percentage helper
function cleanPct(val) {
  if (!val) return '—';
  return val.toString().replace('%','').trim();
}

// Load data
async function loadETFs() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    const text = await res.text();
    const lines = text.trim().split('\n');
    allETFs = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
      if (cols.length < 12 || !cols[0]) continue;

      allETFs.push({
        symbol: cols[0].toUpperCase(),
        name: cols[1],
        provider: cols[2],
        yield: cleanPct(cols[3]),
        taxGrade: cols[4],
        expRatio: cleanPct(cols[5]),
        aum: cols[6],
        totalReturn: cols[7],
        priceDecay: cols[8],
        inception: cols[9],
        frequency: cols[10],
        rating: cols[11]
      });
    }
    resetDeck();
  } catch(e) {
    document.getElementById('swipeContainer').innerHTML = `<div style="padding:80px 20px;text-align:center;color:red">Failed to load data. Please refresh.</div>`;
  }
}

function resetDeck() {
  deck = [...allETFs].sort(() => Math.random() - 0.5);
  currentIndex = 0;
  renderCurrentCard();
}

function shuffleDeck() {
  deck = [...allETFs].sort(() => Math.random() - 0.5);
  currentIndex = 0;
  renderCurrentCard();
}

// Render card
function renderCurrentCard() {
  const container = document.getElementById('swipeContainer');
  container.innerHTML = '';

  if (currentIndex >= deck.length) {
    container.innerHTML = `
      <div style="height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;border-radius:24px;box-shadow:0 25px 70px -10px rgba(0,0,0,.15);text-align:center;padding:40px">
        <h2 style="font-size:34px">🎉 All done!</h2>
        <p style="margin:16px 0 30px;color:#64748B">Refresh for a brand new deck</p>
        <button onclick="location.reload()" style="padding:14px 40px;background:#0F766E;color:white;border:none;border-radius:999px;font-size:17px">🔄 New Deck</button>
      </div>`;
    return;
  }

  const etf = deck[currentIndex];

  const html = `
    <div class="etf-card" id="mainCard" ondblclick="showDetail('${etf.symbol}')">
      <div class="card-header">
        <div>
          <div class="ticker-big">${etf.symbol}</div>
          <div class="etf-name">${etf.name}</div>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-box"><div class="stat-val">${etf.yield}%</div><div class="stat-lbl">Yield</div></div>
        <div class="stat-box"><div class="stat-val">${etf.taxGrade}</div><div class="stat-lbl">Tax</div></div>
        <div class="stat-box"><div class="stat-val">${etf.expRatio}%</div><div class="stat-lbl">Expense</div></div>
        <div class="stat-box"><div class="stat-val">${etf.totalReturn}</div><div class="stat-lbl">1Y Return</div></div>
      </div>
      <div class="expanded-info">
        <div class="info-grid">
          <div class="info-row"><span class="info-label">Provider</span><span class="info-value">${etf.provider}</span></div>
          <div class="info-row"><span class="info-label">AUM</span><span class="info-value">${etf.aum}</span></div>
          <div class="info-row"><span class="info-label">Frequency</span><span class="info-value">${etf.frequency}</span></div>
          <div class="info-row"><span class="info-label">Inception</span><span class="info-value">${etf.inception}</span></div>
          <div class="info-row"><span class="info-label">Price Decay</span><span class="info-value">${etf.priceDecay}</span></div>
          <div class="info-row"><span class="info-label">Rating</span><span class="info-value">${etf.rating}</span></div>
        </div>
      </div>
    </div>
  `;
  container.innerHTML = html;
  document.getElementById('remaining').textContent = deck.length - currentIndex;
  updateProgress();
}

function updateProgress() {
  const pct = deck.length ? Math.round((currentIndex / deck.length) * 100) : 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

// Virtual Pageview for Google Analytics
function trackPageView() {
  if (typeof gtag !== 'undefined') {
    gtag('event', 'page_view', {
      page_location: window.location.origin + window.location.pathname + '#card-' + Date.now(),
      page_title: 'Swipe ETFs • ' + (deck[currentIndex] ? deck[currentIndex].symbol : 'Done')
    });
  }
}

// Swipe functions
function swipeLeft() {
  const card = document.getElementById('mainCard');
  if (!card) return;
  card.classList.add('swipe-left');
  setTimeout(() => {
    currentIndex++;
    renderCurrentCard();
    trackPageView();
  }, 420);
}

function swipeRight() {
  const card = document.getElementById('mainCard');
  if (!card) return;

  const etf = deck[currentIndex];
  if (!savedETFs.some(e => e.symbol === etf.symbol)) {
    savedETFs.push(etf);
    document.getElementById('savedCount').textContent = savedETFs.length;
  }

  card.classList.add('swipe-right');
  setTimeout(() => {
    currentIndex++;
    renderCurrentCard();
    trackPageView();
  }, 420);
}

function newCard() { location.reload(); }

// Saved & Modal functions (same as previous version - abbreviated here for space)
function showSaved() { /* ... full implementation from previous version ... */ }
function hideSaved() { document.getElementById('savedPanel').style.display = 'none'; }
function showDetail(symbol) { /* full modal from previous version */ }
function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

// Keyboard + Touch support
document.addEventListener('keydown', e => {
  if (e.key === "ArrowLeft") swipeLeft();
  if (e.key === "ArrowRight") swipeRight();
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (diff < -80) swipeLeft();
  if (diff > 80) swipeRight();
});

// Init
window.onload = loadETFs;
</script>
</body>
</html>
